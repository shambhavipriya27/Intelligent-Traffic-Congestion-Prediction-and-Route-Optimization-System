        }

        .input-group label i {

    let currentMap = null;

    const OSRM_URL = "https://router.project-osrm.org/route/v1/driving/";

    function normalizeString(str) {
        return str.toLowerCase().trim().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ');
    }

    function findInIndiaDB(searchText) {
        const normalized = normalizeString(searchText);
        
        for (const [key, value] of Object.entries(indiaDB)) {
            if (normalized === key || normalized.includes(key) || key.includes(normalized)) {
                currentCity = value.city;
                return { lat: value.lat, lng: value.lng, found: true, name: key, city: value.city };
            }
        }
        
        const words = normalized.split(' ');
        for (const [key, value] of Object.entries(indiaDB)) {
            for (const word of words) {
                if (word.length > 2 && key.includes(word)) {
                    currentCity = value.city;
                    return { lat: value.lat, lng: value.lng, found: true, name: key, city: value.city };
                }
            }
        }
        
        return { found: false };
    }

    function detectCityFromAddress(address) {
        const lowerAddr = address.toLowerCase();
        if (lowerAddr.includes("bangalore") || lowerAddr.includes("bengaluru")) return "Bangalore";
        if (lowerAddr.includes("delhi")) return "Delhi";
        if (lowerAddr.includes("mumbai")) return "Mumbai";
        if (lowerAddr.includes("chennai")) return "Chennai";
        if (lowerAddr.includes("kolkata")) return "Kolkata";
        if (lowerAddr.includes("hyderabad")) return "Hyderabad";
        if (lowerAddr.includes("pune")) return "Pune";
        return "India";
    }

    async function geocodeAddress(address) {
        if (!address) return null;
        
        const dbResult = findInIndiaDB(address);
        if (dbResult.found) {
            return { lat: dbResult.lat, lng: dbResult.lng, source: "india_db", city: dbResult.city };
        }
        
        const detectedCity = detectCityFromAddress(address);
        
        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ", " + detectedCity + ", India")}&limit=1&accept-language=en`;
            const response = await fetch(url, {
                headers: { 'User-Agent': 'TrafficPredictionApp/1.0' }
            });
            const data = await response.json();
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), source: "nominatim", city: detectedCity };
            }
        } catch(e) {}
        
        return null;
    }

    // Get multiple route alternatives by adding via points
    async function getMultipleRoutes(srcCoord, destCoord) {
        const routes = [];
        
        // Route 1: Direct fastest route
        try {
            const url1 = `${OSRM_URL}${srcCoord.lng},${srcCoord.lat};${destCoord.lng},${destCoord.lat}?overview=full&geometries=polyline&alternatives=true`;
            const response1 = await fetch(url1);
            const data1 = await response1.json();
            
            if (data1.code === "Ok" && data1.routes && data1.routes.length > 0) {
                for (let i = 0; i < Math.min(data1.routes.length, 3); i++) {
                    const route = data1.routes[i];
                    routes.push({
                        name: i === 0 ? "Fastest Route" : (i === 1 ? "Alternate Route 1" : "Alternate Route 2"),
                        distance: (route.distance / 1000).toFixed(1),
                        duration: Math.round(route.duration / 60),
                        geometry: route.geometry,
                        isRecommended: i === 0
                    });
                }
            }
        } catch(e) {}
        
        // If OSRM didn't return alternatives, create some via points
        if (routes.length < 2) {
            // Calculate midpoint and add offset for alternative routes
            const midLat = (srcCoord.lat + destCoord.lat) / 2;
            const midLng = (srcCoord.lng + destCoord.lng) / 2;
            const latDiff = destCoord.lat - srcCoord.lat;
            const lngDiff = destCoord.lng - srcCoord.lng;
            
            // Alternative 1: Northern bypass
            const northPoint = { lat: midLat + latDiff * 0.3, lng: midLng - Math.abs(lngDiff) * 0.2 };
            // Alternative 2: Southern bypass  
            const southPoint = { lat: midLat - latDiff * 0.3, lng: midLng + Math.abs(lngDiff) * 0.2 };
            
            for (let i = 1; i <= 2; i++) {
                const via = i === 1 ? northPoint : southPoint;
                const urlVia = `${OSRM_URL}${srcCoord.lng},${srcCoord.lat};${via.lng},${via.lat};${destCoord.lng},${destCoord.lat}?overview=full&geometries=polyline`;
                try {
                    const viaRes = await fetch(urlVia);
                    const viaData = await viaRes.json();
                    if (viaData.code === "Ok" && viaData.routes && viaData.routes.length > 0) {
                        const route = viaData.routes[0];
                        routes.push({
                            name: i === 1 ? "Northern Bypass" : "Southern Bypass",
                            distance: (route.distance / 1000).toFixed(1),
                            duration: Math.round(route.duration / 60),
                            geometry: route.geometry,
                            isRecommended: false
                        });
                    }
                } catch(e) {}
            }
        }
        
        return routes;
    }

    function decodePolyline(encoded) {
        if (!encoded) return [];
        let points = [];
        let index = 0, len = encoded.length;
        let lat = 0, lng = 0;
        
        while (index < len) {
            let b, shift = 0, result = 0;
            do {
                b = encoded.charCodeAt(index++) - 63;
                result |= (b & 0x1f) << shift;
                shift += 5;
            } while (b >= 0x20);
            let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
            lat += dlat;
            
            shift = 0;
            result = 0;
            do {
                b = encoded.charCodeAt(index++) - 63;
                result |= (b & 0x1f) << shift;
                shift += 5;
            } while (b >= 0x20);
            let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
            lng += dlng;
            
            points.push([lat / 1e5, lng / 1e5]);
        }
        return points;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateTimeOfDay() {
        const hour = new Date().getHours();
        if (hour >= 6 && hour < 11) return "morning";
        if (hour >= 11 && hour < 16) return "afternoon";
        if (hour >= 16 && hour < 20) return "evening";
        return "night";
    }

    async function fetchRealWeather(city = "India") {
        const cityCoords = {
            "Bangalore": { lat: 12.9716, lon: 77.5946 },
            "Delhi": { lat: 28.6139, lon: 77.2090 },
            "Mumbai": { lat: 19.0760, lon: 72.8777 },
            "India": { lat: 20.5937, lon: 78.9629 }
        };
        const coord = cityCoords[city] || cityCoords["India"];
        
        try {
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord.lat}&longitude=${coord.lon}&current_weather=true`);
            const weatherData = await weatherRes.json();
            if (weatherData.current_weather) {
                const w = weatherData.current_weather;
                let condition = "clear";
                const code = w.weathercode;
                if (code === 0) condition = "clear";
                else if (code <= 3) condition = "cloudy";
                else if (code >= 45 && code <= 48) condition = "foggy";
                else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) condition = "rainy";
                
                currentWeather = {
                    condition: condition,
                    temp: Math.round(w.temperature),
                    description: condition === "clear" ? "Clear" : (condition === "rainy" ? "Rainy" : (condition === "foggy" ? "Foggy" : "Cloudy"))
                };
            }
        } catch(e) {
            currentWeather = { condition: "clear", temp: 26, description: "Clear" };
        }
    }

    async function updateLiveInfoUI(city = "India") {
        currentTimeSlot = updateTimeOfDay();
        let timeDisplay = "";
        if (currentTimeSlot === "morning") timeDisplay = "Morning (8-11 AM) - Peak";
        else if (currentTimeSlot === "afternoon") timeDisplay = "Afternoon (11-4 PM) - Moderate";
        else if (currentTimeSlot === "evening") timeDisplay = "Evening (4-8 PM) - Heavy Peak";
        else timeDisplay = "Night (8 PM-6 AM) - Low";
        
        await fetchRealWeather(city);
        
        document.getElementById("timeText").innerHTML = `${new Date().toLocaleTimeString()} | ${timeDisplay}`;
        document.getElementById("weatherText").innerHTML = `${city}: ${currentWeather.description}, ${currentWeather.temp}°C`;
    }

    function predictCongestionIndex(timeSlot, weatherCond, distanceKm, city) {
        let base = 30;
        const cityFactor = { "Bangalore": 5, "Delhi": 15, "Mumbai": 12 };
        const extra = cityFactor[city] || 0;
        
        switch(timeSlot) {
            case "morning": base = 65 + extra; break;
            case "afternoon": base = 48 + extra/2; break;
            case "evening": base = 82 + extra; break;
            case "night": base = 20 + extra/3; break;
        }
        
        let weatherImpact = 0;
        if (weatherCond === "rainy") weatherImpact = 22;
        else if (weatherCond === "foggy") weatherImpact = 20;
        else if (weatherCond === "cloudy") weatherImpact = 8;
        
        let distanceFactor = Math.min(12, distanceKm / 2);
        let index = base + weatherImpact + distanceFactor;
        return Math.min(98, Math.max(5, Math.round(index)));
    }

    function getCongestionDetails(index) {
        if (index <= 40) return { level: "LOW TRAFFIC", class: "low", advice: "Traffic is light! Smooth drive.", multiplier: 1.0 };
        if (index <= 70) return { level: "MODERATE CONGESTION", class: "moderate", advice: "Moderate delays expected.", multiplier: 1.28 };
        return { level: "HIGH CONGESTION", class: "high", advice: "Heavy traffic! Consider alternate route.", multiplier: 1.65 };
    }

    function clearRoutes() {
        currentRouteLayers.forEach(layer => {
            if (currentMap) currentMap.removeLayer(layer);
        });
        currentRouteLayers = [];
    }

    function displayRouteOnMap(route, color, isSelected = false) {
        const points = decodePolyline(route.geometry);
        if (points.length > 0) {
            const line = L.polyline(points, { 
                color: color, 
                weight: isSelected ? 6 : 4, 
                opacity: isSelected ? 0.9 : 0.6,
                dashArray: isSelected ? null : '5, 8'
            }).addTo(currentMap);
            currentRouteLayers.push(line);
            return line;
        }
        return null;
    }

    function displayRouteOptions(routes, srcCoord, destCoord) {
        const colors = ['#f97316', '#3b82f6', '#10b981'];
        clearRoutes();
        
        // Display all routes on map
        routes.forEach((route, index) => {
            const color = colors[index % colors.length];
            displayRouteOnMap(route, color, index === 0);
        });
        
        // Add markers
        currentMap.eachLayer((layer) => {
            if (layer instanceof L.Marker && !(layer._popup && layer._popup._content?.includes("Source"))) {
                currentMap.removeLayer(layer);
            }
        });
        
        L.marker([srcCoord.lat, srcCoord.lng]).addTo(currentMap).bindPopup("<b>📍 Source</b>");
        L.marker([destCoord.lat, destCoord.lng]).addTo(currentMap).bindPopup("<b>🏁 Destination</b>");
        
        // Fit bounds to show all routes
        const allPoints = [];
        routes.forEach(route => {
            const points = decodePolyline(route.geometry);
            points.forEach(p => allPoints.push(p));
        });
        if (allPoints.length > 0) {
            const bounds = L.latLngBounds(allPoints);
            currentMap.fitBounds(bounds, { padding: [50, 50] });
        }
        
        // Update route options UI
        const routeOptionsDiv = document.getElementById("routeOptions");
        routeOptionsDiv.innerHTML = routes.map((route, idx) => `
            <div class="route-option" style="border-left-color: ${colors[idx % colors.length]}" onclick="selectRoute(${idx})">
                <div class="route-name">
                    <span>${route.name}</span>
                    <span>${idx === 0 ? '⭐ Recommended' : ''}</span>
                </div>
                <div class="route-details">
                    <span>📏 ${route.distance} km</span>
                    <span>⏱️ ${route.duration} min</span>
                </div>
            </div>
        `).join('');
        
        document.getElementById("routesContainer").style.display = "block";
        
        // Store routes for selection
        window.currentRoutesData = routes;
        window.currentColors = colors;
        window.currentSrcCoord = srcCoord;
        window.currentDestCoord = destCoord;
    }

    // Global function for route selection
    window.selectRoute = function(routeIndex) {
        const routes = window.currentRoutesData;
        const colors = window.currentColors;
        const srcCoord = window.currentSrcCoord;
        const destCoord = window.currentDestCoord;
        
        if (!routes || !srcCoord) return;
        
        // Update UI to show selected route
        const routeOptions = document.querySelectorAll('.route-option');
        routeOptions.forEach((opt, idx) => {
            if (idx === routeIndex) {
                opt.classList.add('selected');
            } else {
                opt.classList.remove('selected');
            }
        });
        
        // Redraw with selected route highlighted
        clearRoutes();
        
        routes.forEach((route, idx) => {
            const color = colors[idx % colors.length];
            const isSelected = idx === routeIndex;
            const points = decodePolyline(route.geometry);
            if (points.length > 0) {
                const line = L.polyline(points, { 
                    color: color, 
                    weight: isSelected ? 6 : 3, 
                    opacity: isSelected ? 0.9 : 0.4,
                    dashArray: isSelected ? null : '5, 8'
                }).addTo(currentMap);
                currentRouteLayers.push(line);
            }
        });
        
        // Add markers
        L.marker([srcCoord.lat, srcCoord.lng]).addTo(currentMap).bindPopup("<b>📍 Source</b>");
        L.marker([destCoord.lat, destCoord.lng]).addTo(currentMap).bindPopup("<b>🏁 Destination</b>");
        
        // Update AI prediction for selected route
        const selectedRoute = routes[routeIndex];
        const detectedCity = srcCoord.city || "India";
        const congestionIdx = predictCongestionIndex(currentTimeSlot, currentWeather.condition, parseFloat(selectedRoute.distance), detectedCity);
        const congestionDetails = getCongestionDetails(congestionIdx);
        const finalTime = Math.round(selectedRoute.duration * congestionDetails.multiplier);
        
        document.getElementById("resultPanel").style.display = "block";
        document.getElementById("distValue").innerHTML = `${selectedRoute.distance} km`;
        document.getElementById("timeValue").innerHTML = `${finalTime} min`;
        document.getElementById("congestionLevelDiv").innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap:wrap;">
                <span><strong>Congestion Index:</strong> ${congestionIdx}%</span>
                <span class="congestion-tag ${congestionDetails.class}">${congestionDetails.level}</span>
            </div>
            <div style="margin-top: 6px; font-size: 0.7rem;">📊 ${detectedCity} | ${currentTimeSlot.toUpperCase()} | ${currentWeather.condition}</div>
        `;
        document.getElementById("routeMsg").innerHTML = `
            <i class="fas fa-route"></i> <strong>Recommendation:</strong> ${congestionDetails.advice}<br>
            <i class="fas fa-cloud-moon"></i> ${detectedCity}: ${currentWeather.description} (${currentWeather.temp}°C)<br>
            <i class="fas fa-chart-line"></i> Estimated arrival: ${finalTime} minutes
            ${congestionIdx > 70 ? '<br><span style="color:#dc2626;">🚀 ${selectedRoute.name} might be better</span>' : ''}
        `;
        
        L.popup().setLatLng(currentMap.getCenter()).setContent(`🚦 Selected: ${selectedRoute.name} | ${congestionIdx}%`).openOn(currentMap);
        setTimeout(() => currentMap.closePopup(), 2500);
    };

    async function runFullPrediction() {
        const source = document.getElementById("source").value.trim();
        const dest = document.getElementById("destination").value.trim();
        
        if (!source || !dest) {
            alert("Please enter both source and destination!");
            return;
        }
        
        const resultPanel = document.getElementById("resultPanel");
        resultPanel.style.display = "none";
        document.getElementById("routesContainer").style.display = "none";
        document.getElementById("congestionLevelDiv").innerHTML = "<i class='fas fa-spinner fa-pulse'></i> Finding multiple routes...";
        
        const srcCoord = await geocodeAddress(source);
        const destCoord = await geocodeAddress(dest);
        
        if (!srcCoord || !destCoord) {
            alert("Location not found. Please be more specific (e.g., 'Koramangala, Bangalore')");
            return;
        }
        
        const detectedCity = srcCoord.city || detectCityFromAddress(source);
        await updateLiveInfoUI(detectedCity);
        
        const routes = await getMultipleRoutes(srcCoord, destCoord);
        
        if (routes.length === 0) {
            alert("Could not find routes. Please try different locations.");
            return;
        }
        
        displayRouteOptions(routes, srcCoord, destCoord);
        
        // Auto-select first route and show prediction
        setTimeout(() => {
            window.selectRoute(0);
        }, 500);
    }

    window.addEventListener("load", async () => {
        currentMap = L.map('map').setView([12.9716, 77.5946], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(currentMap);
        
        await updateLiveInfoUI("Bangalore");
        
        document.getElementById("predictBtn").addEventListener("click", runFullPrediction);
        setInterval(async () => { await updateLiveInfoUI(currentCity); }, 300000);
    });
</script>
